# Valkey para la plataforma EIRA. En esta máquina no hay Docker; este archivo
# sirve para desplegar en otro lado: `docker compose up -d valkey`.
services:
  valkey:
    image: valkey/valkey:9
    command: ["valkey-server", "--appendonly", "yes", "--requirepass", "${VALKEY_PASSWORD:?Define VALKEY_PASSWORD}"]
    ports:
      - "127.0.0.1:${VALKEY_PORT:-6379}:6379"
    volumes:
      - valkey-data:/data
    restart: unless-stopped

volumes:
  valkey-data:
